<h1>Liste des jeux :</h1>

@if (loading()) {
  <p>Chargement...</p>
} @else if (error()) {
  <p class="error">Erreur: {{ error() }}</p>
} @else {
  <div class="cards">
    @for (game of games(); track $index) {
      <div class="card">
        <a [routerLink]="['/games', game.id]">
          <div class="card-name">{{ game.name }}</div>
          <div class="card-max-level">Niveau max: {{ game.maxLevel }}</div>
        </a>
      </div>
    } @empty {
      <div class="card">
        <p>Aucun jeu.</p>
      </div>
    }
  </div>
}
